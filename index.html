<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawn of Braga</title>
<style>
  /* mínimo para la pantalla de carga (el resto llega con src/ui/ui.css) */
  html, body { margin: 0; height: 100%; background: #060505; color: #a89c85; overflow: hidden; }
  .hidden { display: none !important; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 26px 'Bastarda', monospace; letter-spacing: 0.1em; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div id="vitals"><canvas class="px" id="vitals-cv"></canvas></div>
  <div id="area"><div class="name"></div><div class="div"></div></div>
  <div id="toasts" class="f-hand"></div>
  <div id="prompt" class="f-hand"><span class="keys" id="prompt-key"></span><span id="prompt-label">Abrir</span></div>
  <div id="bossbar"><div class="name"></div><canvas class="px" id="boss-cv"></canvas></div>
  <div id="lock"></div>
  <div id="ebars"></div>
  <div id="fps" class="f-small hidden"></div>
</div>

<section id="loading" class="screen"><div>Braga arde<span class="dots"></span></div></section>

<section id="title" class="screen hidden">
  <div class="wrap">
    <div id="title-art"></div>
    <div class="press f-small" id="press">Pulsa cualquier botón</div>
    <div class="menu-list hidden" id="title-menu"></div>
  </div>
  <div class="foot f-small">Teclado y ratón · Mando (XInput)</div>
</section>

<section id="pause" class="screen veil hidden">
  <div class="panel" data-crest="1">
    <div class="eyebrow f-small" data-div="1">En pausa</div>
    <div class="menu-list" id="pause-menu" style="margin-top:calc(var(--u) * 6)"></div>
  </div>
</section>

<section id="inv" class="screen veil hidden">
  <div class="panel" data-crest="1">
    <div class="eyebrow f-small" data-div="1">Inventario</div>
    <div class="tabs f-bast"><span class="tab on" data-t="0">Objetos</span><span class="tab" data-t="1">Documentos</span></div>
    <div class="cols">
      <div><div class="grid" id="inv-grid"></div><div class="docs f-hand hidden" id="inv-docs"></div></div>
      <div class="detail f-hand" id="inv-detail"></div>
    </div>
    <div class="hint f-hand" id="inv-hint"></div>
  </div>
</section>

<section id="note" class="screen veil hidden">
  <div class="parch"><h3 id="note-title" class="f-bastL"></h3><div class="text f-bast" id="note-text"></div><div class="hint f-hand" id="note-hint"></div></div>
</section>

<section id="item" class="screen veil hidden">
  <div class="panel" data-crest="1">
    <div class="eyebrow f-small" data-div="1">Objeto obtenido</div>
    <div class="icon" id="item-icon"></div>
    <h2 id="item-name" class="f-bastL"></h2>
    <p id="item-desc" class="f-hand"></p>
    <div class="hint f-hand" id="item-hint"></div>
  </div>
</section>

<section id="map" class="screen veil hidden">
  <div class="panel">
    <div class="eyebrow f-small" data-div="1" id="map-eyebrow">Mapa de Braga</div>
    <canvas class="px map" id="map-canvas"></canvas>
    <div class="legend f-hand" id="map-legend"></div>
    <div class="hint f-hand" id="map-hint"></div>
  </div>
</section>

<section id="options" class="screen veil hidden">
  <div class="panel" data-crest="1"><div class="eyebrow f-small" data-div="1">Opciones</div><div id="opt-list" class="f-hand" style="margin-top:calc(var(--u) * 5)"></div><div class="hint f-hand" id="opt-hint"></div></div>
</section>

<section id="controls" class="screen veil hidden">
  <div class="panel" data-crest="1"><div class="eyebrow f-small" data-div="1">Controles</div><div class="ctl f-hand" id="ctl-list"></div><div class="hint f-hand" id="ctl-hint"></div></div>
</section>

<section id="death" class="screen hidden"><div class="band" id="death-band"></div></section>
<section id="story" class="screen hidden"><div id="story-lines" class="f-bastL"></div></section>
<section id="ending" class="screen hidden"><div class="parch" id="ending-body"></div></section>

<script type="module" src="./src/main.js"></script>
</body>
</html>
