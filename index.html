<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawn of Braga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root {
  color-scheme: dark;
  --void: #0a0908;
  --ink: #120f0d;
  --bone: #d9d0bb;
  --ash: #8c877c;
  --dim: #5d584f;
  --blood: #8b1a14;
  --blood-hi: #c0342a;
  --ember: #d8792c;
  --gold: #a88b4c;
  --stamina: #7d8a4a;
  --parch: #cbb98f;
  --parch-ink: #2e2217;
  --display: 'IM Fell English SC', 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
  --body: 'IM Fell English', Garamond, 'Times New Roman', serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--void); color: var(--bone); overflow: hidden; font-family: var(--body); }
canvas#gl { display: block; position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: none; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; }

/* ---------------------------------------------------------------- HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#vitals { position: absolute; top: max(20px, env(safe-area-inset-top)); left: 24px; display: grid; gap: 5px; }
.bar { position: relative; height: 12px; background: rgba(8, 6, 5, 0.75); border: 1px solid rgba(168, 139, 76, 0.55); box-shadow: 0 0 0 1px rgba(0,0,0,0.8), inset 0 0 6px rgba(0,0,0,0.9); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
.bar .lag { background: #d8c49a; opacity: 0.55; transition: width 0.6s ease-out 0.35s; }
.bar.hp .fill { background: linear-gradient(#b3281f, #6d1210); }
.bar.st { height: 8px; }
.bar.st .fill { background: linear-gradient(#95a256, #58642e); }
.bar.st.empty .fill { background: #5a2a1a; }
#flasks { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-family: var(--display); font-size: 18px; text-shadow: 0 1px 2px #000; }
#flasks img { width: 36px; height: 36px; image-rendering: pixelated; filter: drop-shadow(0 1px 2px #000); }
#flasks.empty img { filter: grayscale(1) brightness(0.5); }

#area { position: absolute; top: 18%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: clamp(26px, 4.2vw, 48px); letter-spacing: 0.12em; color: var(--bone); text-shadow: 0 0 18px rgba(0,0,0,0.95), 0 2px 3px #000; opacity: 0; transition: opacity 1.2s; }
#area::after { content: ''; display: block; margin: 10px auto 0; width: min(420px, 60vw); height: 1px; background: linear-gradient(90deg, transparent, rgba(217,208,187,0.7), transparent); }
#area.show { opacity: 1; }

#toasts { position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%); width: min(720px, 92vw); display: grid; gap: 8px; justify-items: center; }
.toast { padding: 8px 22px; background: linear-gradient(90deg, transparent, rgba(6,5,4,0.85) 20%, rgba(6,5,4,0.85) 80%, transparent); font-size: 19px; text-align: center; text-shadow: 0 1px 2px #000; animation: toastIn 0.4s ease-out; }
.toast.out { opacity: 0; transition: opacity 0.8s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } }

#prompt { position: absolute; left: 50%; bottom: 25%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 20px; font-size: 20px; background: linear-gradient(90deg, transparent, rgba(6,5,4,0.8) 25%, rgba(6,5,4,0.8) 75%, transparent); text-shadow: 0 1px 2px #000; opacity: 0; transition: opacity 0.2s; }
#prompt.show { opacity: 1; }
.key { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 7px; border: 1px solid var(--gold); border-radius: 3px; font-family: var(--display); font-size: 15px; font-weight: normal; color: var(--bone); background: rgba(20,16,12,0.9); }
.key.pad { border-radius: 50%; min-width: 26px; padding: 0; }
.key.pad.a { color: #6fcf6a; border-color: #6fcf6a; }
.key.pad.b { color: #e0554a; border-color: #e0554a; }
.key.pad.x { color: #5a8fe0; border-color: #5a8fe0; }
.key.pad.y { color: #e0c04a; border-color: #e0c04a; }

#bossbar { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); width: min(760px, 80vw); opacity: 0; transition: opacity 0.8s; }
#bossbar.show { opacity: 1; }
#bossbar .name { font-family: var(--display); font-size: 20px; letter-spacing: 0.06em; margin-bottom: 4px; text-shadow: 0 1px 3px #000; }
#bossbar .bar { height: 10px; }
#bossbar .fill { background: linear-gradient(#a21e18, #5a0e0b); }

#lock { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid rgba(255, 236, 200, 0.95); transform: rotate(45deg); box-shadow: 0 0 6px rgba(255, 180, 90, 0.8); opacity: 0; transition: opacity 0.15s; }
#lock.show { opacity: 1; }
#ebars .eb { position: absolute; width: 70px; height: 4px; margin-left: -35px; background: rgba(0,0,0,0.7); border: 1px solid rgba(0,0,0,0.9); }
#ebars .eb i { display: block; height: 100%; background: #a3241c; }

#fps { position: absolute; right: 10px; top: 8px; font: 12px monospace; color: #7a7; }

/* ---------------------------------------------------------------- pantallas */
.screen { position: fixed; inset: 0; display: grid; place-items: center; }
.veil { background: radial-gradient(ellipse at center, rgba(8,7,6,0.72), rgba(3,3,3,0.94)); }

#loading { background: var(--void); font-family: var(--display); letter-spacing: 0.2em; color: var(--ash); font-size: 18px; }
#loading .dots::after { content: '…'; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: 0.2; } }

#title { align-content: center; justify-items: center; gap: 0; text-align: center; background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.8)); }
#title h1 { margin: 0; font-family: var(--display); font-weight: normal; font-size: clamp(44px, 9vw, 112px); letter-spacing: 0.08em; line-height: 0.95; color: #e4dac3; text-shadow: 0 0 30px rgba(139,26,20,0.55), 0 0 2px #000, 0 4px 8px #000; text-wrap: balance; }
#title h1 span { display: block; font-size: 0.34em; letter-spacing: 0.5em; color: var(--ash); margin-bottom: 0.4em; text-indent: 0.5em; }
#title .sub { margin: 18px 0 44px; font-style: italic; font-size: clamp(16px, 2vw, 21px); color: var(--ash); }
#title .press { font-family: var(--display); letter-spacing: 0.3em; font-size: 15px; color: var(--ash); animation: blink 2.4s infinite; }
#title .foot { position: absolute; bottom: 18px; left: 0; right: 0; font-size: 13px; color: var(--dim); letter-spacing: 0.08em; }

.menu-list { display: grid; gap: 4px; min-width: 280px; }
.menu-list .it { position: relative; padding: 7px 34px; font-family: var(--display); font-size: 22px; letter-spacing: 0.08em; color: var(--ash); cursor: pointer; text-align: center; background: none; border: 0; }
.menu-list .it.sel { color: var(--bone); text-shadow: 0 0 12px rgba(216,121,44,0.5); }
.menu-list .it.sel::before { content: ''; position: absolute; left: 8px; top: 50%; width: 7px; height: 7px; margin-top: -4px; background: var(--ember); transform: rotate(45deg); box-shadow: 0 0 8px var(--ember); }
.menu-list .it.off { opacity: 0.35; }

.panel { width: min(860px, 94vw); max-height: 88vh; padding: 26px 34px; background: linear-gradient(rgba(14,11,9,0.96), rgba(8,7,6,0.97)); border: 1px solid rgba(168,139,76,0.35); box-shadow: 0 0 0 1px #000, 0 20px 60px rgba(0,0,0,0.8); overflow: auto; }
.panel h2 { margin: 0 0 4px; font-family: var(--display); font-weight: normal; letter-spacing: 0.1em; font-size: 28px; }
.panel .eyebrow { font-family: var(--display); letter-spacing: 0.25em; font-size: 12px; color: var(--gold); }
.hint { margin-top: 18px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-size: 15px; color: var(--ash); }
.hint span { display: inline-flex; align-items: center; gap: 7px; }

#pause .panel { width: auto; min-width: 340px; text-align: center; }

/* inventario */
#inv .cols { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; margin-top: 14px; }
@media (max-width: 700px) { #inv .cols { grid-template-columns: 1fr; } }
.tabs { display: flex; gap: 20px; margin-top: 8px; font-family: var(--display); letter-spacing: 0.1em; }
.tabs .tab { color: var(--dim); }
.tabs .tab.on { color: var(--bone); border-bottom: 1px solid var(--ember); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, 72px); gap: 8px; align-content: start; }
.slot { width: 72px; height: 72px; display: grid; place-items: center; background: rgba(0,0,0,0.45); border: 1px solid rgba(168,139,76,0.22); position: relative; cursor: pointer; }
.slot img { width: 52px; height: 52px; image-rendering: pixelated; }
.slot.sel { border-color: var(--ember); box-shadow: 0 0 10px rgba(216,121,44,0.4) inset; }
.slot .n { position: absolute; right: 4px; bottom: 2px; font-size: 13px; }
.docs { display: grid; gap: 2px; }
.docs .doc { padding: 7px 10px; color: var(--ash); cursor: pointer; border-left: 2px solid transparent; }
.docs .doc.sel { color: var(--bone); border-left-color: var(--ember); background: rgba(255,255,255,0.03); }
.detail h3 { margin: 0 0 8px; font-family: var(--display); font-weight: normal; font-size: 22px; letter-spacing: 0.05em; }
.detail p { margin: 0; line-height: 1.55; color: #c9bfa9; max-width: 42ch; }
.stats { margin-top: 18px; display: grid; grid-template-columns: auto auto; gap: 4px 18px; justify-content: start; font-size: 15px; color: var(--ash); font-variant-numeric: tabular-nums; }
.stats b { color: var(--bone); font-weight: normal; }

/* documentos */
#note .parch { position: relative; width: min(600px, 92vw); max-height: 86vh; overflow: auto; padding: 38px 44px 30px; color: var(--parch-ink); background:
  radial-gradient(ellipse at 20% 10%, rgba(255,240,200,0.35), transparent 60%),
  radial-gradient(ellipse at 90% 90%, rgba(80,50,20,0.35), transparent 55%),
  radial-gradient(ellipse at 50% 50%, #cfbd92, #b09c6c 85%, #8a7650);
  box-shadow: inset 0 0 60px rgba(60,35,10,0.55), 0 20px 60px rgba(0,0,0,0.85); }
#note .parch::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(90,60,30,0.05) 0 1px, transparent 1px 3px); }
#note h3 { margin: 0 0 16px; font-family: var(--display); font-weight: normal; font-size: 24px; letter-spacing: 0.06em; }
#note .text { white-space: pre-wrap; font-size: 20px; line-height: 1.55; }
#note .hint { color: #5a4630; }

/* objeto obtenido */
#item .panel { width: min(520px, 92vw); text-align: center; }
#item img { width: 96px; height: 96px; image-rendering: pixelated; margin: 12px auto 8px; display: block; filter: drop-shadow(0 0 12px rgba(255,220,150,0.25)); }
#item p { margin: 8px auto 0; max-width: 40ch; line-height: 1.5; color: #c9bfa9; }

/* mapa */
#map .panel { width: min(1100px, 96vw); }
#map canvas { width: 100%; height: auto; display: block; margin-top: 12px; background: #16120e; border: 1px solid rgba(168,139,76,0.25); image-rendering: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 14px; color: var(--ash); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }

/* opciones */
#options .panel, #controls .panel { width: min(640px, 94vw); }
.opt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 8px 12px; color: var(--ash); cursor: pointer; }
.opt.sel { color: var(--bone); background: rgba(255,255,255,0.04); box-shadow: inset 2px 0 0 var(--ember); }
.opt .v { font-family: var(--display); letter-spacing: 0.05em; min-width: 150px; text-align: right; font-variant-numeric: tabular-nums; }
.ctl { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 22px; align-items: center; margin-top: 14px; font-size: 16px; }
.ctl .h { font-family: var(--display); color: var(--gold); letter-spacing: 0.12em; font-size: 13px; }

/* muerte */
#death { pointer-events: none; }
#death .band { width: 100%; padding: 30px 0; text-align: center; background: linear-gradient(transparent, rgba(0,0,0,0.85) 30%, rgba(0,0,0,0.85) 70%, transparent); font-family: var(--display); font-size: clamp(48px, 8vw, 96px); letter-spacing: 0.14em; color: #9e1b14; text-shadow: 0 0 24px rgba(160,20,10,0.55); opacity: 0; transform: scale(1.06); transition: opacity 1.6s ease, transform 4s ease; }
#death.show .band { opacity: 1; transform: scale(1); }

/* intro / final */
#story { background: #000; text-align: center; font-size: clamp(20px, 2.6vw, 30px); }
#story .line { opacity: 0; transition: opacity 1.8s; margin: 10px 0; }
#story .line.show { opacity: 1; }
#story .big { font-family: var(--display); font-size: clamp(38px, 6vw, 72px); letter-spacing: 0.12em; }
#story .small { font-size: 16px; color: var(--ash); }
#ending { background: radial-gradient(ellipse at center, rgba(246,228,204,0.2), rgba(120,86,60,0.55)); text-align: center; color: #2a1d14; }
#ending .panel { background: none; border: 0; box-shadow: none; }
#ending h2 { color: #2a1d14; }
#ending .stats { color: #5a4432; }
#ending .stats b { color: #2a1d14; }
#ending .hint { color: #5a4432; }
#ending .credit { margin-top: 34px; color: #6a5440; font-size: 15px; }

#touch-note { position: fixed; bottom: 12px; left: 16px; right: 16px; text-align: center; font-size: 13px; color: var(--ash); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div id="vitals">
    <div class="bar hp" id="hpbar"><i class="lag"></i><i class="fill"></i></div>
    <div class="bar st" id="stbar"><i class="fill"></i></div>
    <div id="flasks"><img id="flask-icon" alt=""><span id="flask-n">3</span></div>
  </div>
  <div id="area"></div>
  <div id="toasts"></div>
  <div id="prompt"><b class="key" id="prompt-key">E</b><span id="prompt-label">Abrir</span></div>
  <div id="bossbar"><div class="name"></div><div class="bar"><i class="lag"></i><i class="fill"></i></div></div>
  <div id="lock"></div>
  <div id="ebars"></div>
  <div id="fps" class="hidden"></div>
</div>

<section id="loading" class="screen"><div>Braga arde<span class="dots"></span></div></section>

<section id="title" class="screen hidden">
  <div>
    <h1><span>Bracara Augusta</span>Dawn of Braga</h1>
    <div class="sub">Amanecer en Braga</div>
    <div class="press" id="press">Pulsa cualquier botón</div>
    <div class="menu-list hidden" id="title-menu"></div>
  </div>
  <div class="foot">Teclado y ratón · Mando (XInput)</div>
</section>

<section id="pause" class="screen veil hidden">
  <div class="panel">
    <div class="eyebrow">En pausa</div>
    <div class="menu-list" id="pause-menu" style="margin-top:14px"></div>
  </div>
</section>

<section id="inv" class="screen veil hidden">
  <div class="panel">
    <div class="eyebrow">Inventario</div>
    <div class="tabs"><span class="tab on" data-t="0">Objetos</span><span class="tab" data-t="1">Documentos</span></div>
    <div class="cols">
      <div><div class="grid" id="inv-grid"></div><div class="docs hidden" id="inv-docs"></div></div>
      <div class="detail" id="inv-detail"></div>
    </div>
    <div class="hint" id="inv-hint"></div>
  </div>
</section>

<section id="note" class="screen veil hidden">
  <div class="parch"><h3 id="note-title"></h3><div class="text" id="note-text"></div><div class="hint" id="note-hint"></div></div>
</section>

<section id="item" class="screen veil hidden">
  <div class="panel"><div class="eyebrow">Objeto obtenido</div><img id="item-icon" alt=""><h2 id="item-name"></h2><p id="item-desc"></p><div class="hint" id="item-hint"></div></div>
</section>

<section id="map" class="screen veil hidden">
  <div class="panel">
    <div class="eyebrow" id="map-eyebrow">Mapa de Braga</div>
    <canvas id="map-canvas" width="1100" height="720"></canvas>
    <div class="legend"><span><i style="background:#e8d8b0"></i>Estás aquí</span><span><i style="background:#e0a040"></i>Altar</span><span><i style="background:#c03028"></i>Paso cerrado</span><span><i style="background:#6a9a50"></i>Paso abierto</span></div>
    <div class="hint" id="map-hint"></div>
  </div>
</section>

<section id="options" class="screen veil hidden">
  <div class="panel"><div class="eyebrow">Opciones</div><div id="opt-list" style="margin-top:12px"></div><div class="hint" id="opt-hint"></div></div>
</section>

<section id="controls" class="screen veil hidden">
  <div class="panel"><div class="eyebrow">Controles</div><div class="ctl" id="ctl-list"></div><div class="hint" id="ctl-hint"></div></div>
</section>

<section id="death" class="screen hidden"><div class="band">HAS CAÍDO</div></section>
<section id="story" class="screen hidden"><div id="story-lines"></div></section>
<section id="ending" class="screen hidden"><div class="panel" id="ending-body"></div></section>

<script type="module" src="./src/main.js"></script>
</body>
</html>
